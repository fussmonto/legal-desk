name: Update legal jobs

on:
  schedule:
    - cron: "30 6 * * *"   # 12:00 PM IST every day
  workflow_dispatch:        # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: python scraper/fetch_jobs.py

      - name: Commit updated jobs.json
        run: |
          git config user.name "legal-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git push
